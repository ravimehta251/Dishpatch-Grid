name: verify-and-publish
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21', cache: maven}
      - run: mvn -B -ntp verify
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: npm ci && npm run build && npm audit --omit=dev --audit-level=high
        working-directory: frontend
      - run: python -m unittest discover -s examples/sample-webhook-receiver -p 'test_*.py'
      - run: bash scripts/setup-env.sh && docker compose config --quiet
      - run: docker compose up -d --build --wait
      - run: python scripts/demo.py
      - run: npx playwright install --with-deps chromium && npx playwright test
        working-directory: frontend
      - run: docker compose down
        if: always()
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: |
            backend/**/target/surefire-reports
            backend/**/target/failsafe-reports
            frontend/test-results
  images:
    needs: verify
    runs-on: ubuntu-latest
    permissions: {contents: read, packages: write}
    strategy:
      matrix:
        include:
          - {name: api, dockerfile: infrastructure/docker/backend.Dockerfile, module: dispatchgrid-api}
          - {name: worker, dockerfile: infrastructure/docker/backend.Dockerfile, module: dispatchgrid-worker}
          - {name: dashboard, dockerfile: infrastructure/docker/dashboard.Dockerfile, module: none}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}/${{ matrix.name }}" >> "$GITHUB_ENV"
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with: {registry: ghcr.io, username: '${{ github.actor }}', password: '${{ secrets.GITHUB_TOKEN }}'}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: '${{ matrix.dockerfile }}'
          build-args: 'MODULE=${{ matrix.module }}'
          load: true
          tags: '${{ env.IMAGE }}:${{ github.sha }}'
      - uses: aquasecurity/trivy-action@0.29.0
        with:
          image-ref: '${{ env.IMAGE }}:${{ github.sha }}'
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
      - if: github.event_name != 'pull_request'
        run: docker push "$IMAGE:${GITHUB_SHA}"
