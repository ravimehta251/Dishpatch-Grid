# Host nginx: replace dispatchgrid.example.com; install certificates with certbot first.
server {
 listen 80;
 server_name dispatchgrid.example.com;
 location /.well-known/acme-challenge/ { root /var/www/certbot; }
 location / { return 301 https://$host$request_uri; }
}
server {
 listen 443 ssl;
 server_name dispatchgrid.example.com;
 ssl_certificate /etc/letsencrypt/live/dispatchgrid.example.com/fullchain.pem;
 ssl_certificate_key /etc/letsencrypt/live/dispatchgrid.example.com/privkey.pem;
 ssl_protocols TLSv1.2 TLSv1.3;
 add_header Strict-Transport-Security 'max-age=31536000' always;
 client_max_body_size 1m;
 location /api/ {
  proxy_pass http://127.0.0.1:8080;
  proxy_set_header Host $http_host;
  proxy_set_header X-Forwarded-Proto https;
  proxy_set_header X-Forwarded-For $remote_addr;
 }
 location / {
  proxy_pass http://127.0.0.1:3000;
  proxy_set_header Host $http_host;
 }
}
