global:
  scrape_interval: 10s
  evaluation_interval: 10s
scrape_configs:
  - job_name: dispatchgrid-api
    metrics_path: /actuator/prometheus
    authorization:
      type: Bearer
      credentials_file: /tmp/monitoring-token
    static_configs:
      - targets: ['api:8080']
  - job_name: dispatchgrid-worker
    metrics_path: /actuator/prometheus
    authorization:
      type: Bearer
      credentials_file: /tmp/monitoring-token
    static_configs:
      - targets: ['worker:8081']
